<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Library Management App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">

    <!-- Заголовок -->
    <div class="text-center mb-4">
        <h1 class="fw-bold">Система управління бібліотекою</h1>
    </div>

    <!-- Блок сповіщень -->
    <div id="notification-area" class="mb-3"></div>

    <div class="row g-4">

        <!-- Форма для додавання книги -->
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title mb-3">Додати книгу</h5>
                    <form id="book-form">
                        <div class="mb-2">
                            <label class="form-label">ID книги</label>
                            <input type="text" class="form-control" name="bookId" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Назва</label>
                            <input type="text" class="form-control" name="bookTitle" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Автор</label>
                            <input type="text" class="form-control" name="bookAuthor" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Рік видання</label>
                            <input type="number" class="form-control" name="bookYear" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Додати книгу</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Форма для додавання користувача -->
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title mb-3">Додати користувача</h5>
                    <form id="user-form">
                        <div class="mb-2">
                            <label class="form-label">ID користувача</label>
                            <input type="text" class="form-control" name="userId" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Ім’я</label>
                            <input type="text" class="form-control" name="userName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="userEmail" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Додати користувача</button>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <!-- Таблиці -->
    <div class="row mt-5">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title mb-3">📚 Список книг</h5>
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Назва</th>
                            <th>Автор</th>
                            <th>Рік</th>
                            <th>Статус</th>
                            <th>Дія</th>
                        </tr>
                        </thead>
                        <tbody id="books-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title mb-3">👤 Користувачі</h5>
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Ім’я</th>
                            <th>Email</th>
                            <th>Книг позичено</th>
                        </tr>
                        </thead>
                        <tbody id="users-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Модальне вікно підтвердження -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmModalLabel">Підтвердження дії</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрити"></button>
            </div>
            <div class="modal-body">
                Ви впевнені, що хочете виконати цю дію?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Скасувати</button>
                <button type="button" class="btn btn-primary" id="modalConfirmBtn">Підтвердити</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS + зібраний скрипт Webpack -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./dist/app.js"></script>
</body>
</html>
